- name: al_eam_nvt
  code: lammps
  description: Al FCC EAM 短 NVT，验证势文件加载与能量基准
  blueprint: examples/L1_Al_EAM_MD
  structure: 内联 system.data（同 L1 蓝本 4 原子 FCC，a=4.0495 Å）
  truncations:
    minimize: "1000/10000 → 200/2000 步"
    equilibration: "20000 步(10 ps) → 200 步(0.1 ps)"
    production: 200000 步 production 整段删除（smoke 不需要）
  timeout: 600
  files:
    system.data: |
      (written by ASE)

      4 atoms
      1 atom types

      0.0      4.0495000000000001  xlo xhi
      0.0      4.0495000000000001  ylo yhi
      0.0      4.0495000000000001  zlo zhi

      Atoms # atomic

           1   1                       0                       0                       0
           2   1                 2.02475                 2.02475                       0
           3   1                 2.02475                       0                 2.02475
           4   1                       0                 2.02475                 2.02475
    in.nvt: |
      # Al FCC EAM NVT smoke（蓝本 examples/L1_Al_EAM_MD，已按 truncations 截断）
      units           metal
      atom_style      atomic
      boundary        p p p
      newton          on

      read_data       system.data

      pair_style      eam
      pair_coeff      * * {{al_eam_path}}   # env 给定 Al_jnp.eam（势库无 Al_u3.eam）

      min_style       cg
      minimize        1.0e-8 1.0e-10 200 2000

      velocity        all create 300.0 12345 dist gaussian

      neighbor        2.0 bin
      neigh_modify    every 1 delay 0 check yes
      timestep        0.0005

      variable        peatom equal pe/atoms
      thermo          20
      thermo_style    custom step temp v_peatom

      fix             equil all nvt temp 300.0 300.0 0.05
      run             200
      unfix           equil
  run: "{{lammps}} -in in.nvt -log lammps.log"
  asserts:
    - type: not_grep
      path: lammps.log
      pattern: '(?i)\bERROR\b'
      note: LAMMPS 报 ERROR 时退出码也是 0 —— 必须 grep 日志判成败
    - type: grep
      path: lammps.log
      pattern: 'Loop time'
      note: 正常跑完
    - type: regex_number
      path: lammps.log
      pattern: '(?m)^\s*\d+\s+[-+0-9.eE]+\s+(-?[0-9.]+(?:[eE][-+]?\d+)?)\s*$'
      occurrence: last
      min: -3.41
      max: -3.31
      note: 末行 thermo PE = -3.36 ± 0.05 eV/atom（Al_jnp.eam，2026-06 实测）


# ==============================================================================
# input_build smoke 用例定义 | scripts/smoke/cases.yaml
#
# 平台无关：所有路径/二进制通过 {{var}} 引用 smoke_env.yaml（见 run_smoke.py
# build_context）。断言值全部来自 wsl-local 环境 2026-06 实测。
#
# 每用例字段：
#   name            唯一用例名（= runs/ 下的工作目录名）
#   code            vasp | cp2k | lammps
#   description     物理目标（一句话）
#   blueprint       技能内参考蓝本（examples/ 或 base_templates/）
#   structure       结构生成方式说明
#   truncations     相对蓝本允许的性能截断（步数 / ENCUT / MAX_SCF 等）
#   timeout         强 timeout（秒）；超时杀进程树并判 TIMEOUT
#   files           内联落盘的输入文件（字面块，支持 {{var}}）
#   potcar          VASP 专用：从 data.vasp_potcars/<El>/POTCAR 按序 cat 生成 POTCAR
#   setup_cmds      运行前 shell 命令（如 CP2K data 软链），支持 {{var}}
#   run             运行命令模板
#   allow_nonzero_exit  允许非零退出（仅 feo_dftu_scf_start 这类人为截断用例）
#   asserts         物理断言列表（类型见 README：file_exists/grep/not_grep/
#                   regex_number/xyz_angle）
#
# 注意：LAMMPS 报 ERROR 时退出码也是 0 —— 每个 lammps 用例必须带
#       not_grep ERROR 断言，不能只看退出码。
#
# 第二波新增用例（2026-07 收录）依赖 smoke_env.yaml 增补键：
#   codes.vasp_ncl        vasp_ncl 二进制（SOC 非共线用）
#   codes.lammps_full     全功能 lmp（10 Sep 2025，含 PLUMED + ML-MACE + KOKKOS）
#   data.mace_model_path  MACE 模型文件（*.model-lammps.pt）
# ==============================================================================

# ==============================================================================
# VASP（7 例）
# ==============================================================================

- name: si_relax
  code: vasp
  description: Si 体相原胞 CG 弛豫，验证 POTCAR/KPOINTS/INCAR 全链路 + 能量基准
  blueprint: base_templates/vasp_relax.incar
  structure: 内联 POSCAR（2 原子 Si 金刚石原胞，同 tests/fixtures/POSCAR_Si）
  truncations:
    NSW: "100 → 30"
    kmesh: "8x8x8 → 4x4x4 MP"
    EDIFF: "1E-6 → 1E-5"
    ENCUT: 400（保持，Si ENMAX ~245 eV，400 已足够）
  timeout: 1200
  files:
    POSCAR: |
      Si
        1.0
        0.0000000000    2.7155000000    2.7155000000
        2.7155000000    0.0000000000    2.7155000000
        2.7155000000    2.7155000000    0.0000000000
      Si
        2
      Cartesian
        0.0000000000    0.0000000000    0.0000000000
        1.3577500000    1.3577500000    1.3577500000
    INCAR: |
      SYSTEM   = Si relax smoke
      PREC     = Normal
      ENCUT    = 400
      ALGO     = Normal
      EDIFF    = 1E-5              # smoke 截断：蓝本 1E-6
      ISMEAR   = 0
      SIGMA    = 0.05              # 半导体：Gaussian 窄涂抹
      NELMIN   = 6
      NELM     = 100
      IBRION   = 2
      ISIF     = 2
      NSW      = 30                # smoke 截断：蓝本 100
      EDIFFG   = -0.03
      POTIM    = 0.5
      ADDGRID  = .TRUE.
      LASPH    = .TRUE.
      LREAL    = .FALSE.           # 2 原子小原胞
      ISYM     = 0
    KPOINTS: |
      Si 4x4x4 MP（smoke 截断：蓝本 8x8x8）
      0
      Monkhorst-Pack
      4 4 4
      0 0 0
  potcar: [Si]
  run: "{{vasp_std}}"
  asserts:
    - type: grep
      path: OUTCAR
      pattern: 'reached required accuracy'
      note: CG 弛豫收敛
    - type: regex_number
      path: OUTCAR
      pattern: 'free\s+energy\s+TOTEN\s*=\s*(-?[0-9.]+)'
      occurrence: last
      divide_by: 2
      min: -5.44
      max: -5.24
      note: Si PE = -5.34 ± 0.1 eV/atom（2026-06 实测）

- name: h2_freq
  code: vasp
  description: H2 分子有限差分频率（IBRION=5），验证频率流程与数值基准
  blueprint: base_templates/vasp_freq.incar
  structure: 内联 POSCAR（H2 在 12 Å 盒子中心，键长 0.75 Å 起步）
  truncations:
    ENCUT: 400（保持模板下限）
    SIGMA: "0.1 → 0.05（孤立小分子，模板注释建议值）"
  timeout: 1800
  files:
    POSCAR: |
      H2 molecule in 12 A box
        1.0
        12.0000000000    0.0000000000    0.0000000000
        0.0000000000    12.0000000000    0.0000000000
        0.0000000000    0.0000000000    12.0000000000
      H
        2
      Cartesian
        6.0000000000    6.0000000000    5.6250000000
        6.0000000000    6.0000000000    6.3750000000
    INCAR: |
      SYSTEM   = H2 freq smoke
      PREC     = Accurate
      ENCUT    = 400
      ALGO     = Normal
      EDIFF    = 1E-6
      ISMEAR   = 0
      SIGMA    = 0.05              # 孤立小分子：0.01-0.05
      NELMIN   = 6
      NELM     = 100
      IBRION   = 5                 # 有限差分 Hessian
      NSW      = 1                 # IBRION=5/6 必须 NSW>0，否则只做静态 SCF
      NFREE    = 2                 # 中心差分
      POTIM    = 0.015
      NWRITE   = 1
      ISYM     = 0
      ADDGRID  = .TRUE.
      LASPH    = .TRUE.
    KPOINTS: |
      Gamma only（孤立分子）
      0
      Gamma
      1 1 1
      0 0 0
  potcar: [H]
  run: "{{vasp_gam}}"
  asserts:
    - type: grep
      path: OUTCAR
      pattern: 'General timing and accounting informations'
      note: VASP 正常收尾
    - type: regex_number
      path: OUTCAR
      pattern: '(?m)^\s*1 f\s+=\s+[0-9.]+\s+THz\s+[0-9.]+\s+2PiTHz\s+([0-9.]+)\s+cm-1'
      occurrence: first
      min: 4200
      max: 4450
      note: H2 伸缩频率 4200-4450 cm-1（2026-06 实测区间）

- name: vaspsol_h2
  code: vasp
  description: H2 + VASPsol 隐式溶剂静态计算，验证 solvation patch 生效
  blueprint: base_templates/vasp_relax.incar + modifiers/solvation.patch
  structure: 内联 POSCAR（同 h2_freq 的 H2/12 Å 盒子）
  truncations:
    NSW: "100 → 0（静态单点即可验证 VASPsol 输出）"
    PREC: Accurate（solvation.patch 要求；保留）
  timeout: 900
  files:
    POSCAR: |
      H2 molecule in 12 A box
        1.0
        12.0000000000    0.0000000000    0.0000000000
        0.0000000000    12.0000000000    0.0000000000
        0.0000000000    0.0000000000    12.0000000000
      H
        2
      Cartesian
        6.0000000000    6.0000000000    5.6250000000
        6.0000000000    6.0000000000    6.3750000000
    INCAR: |
      SYSTEM   = H2 vaspsol smoke
      PREC     = Accurate          # solvation.patch：空化能需要更细网格
      ENCUT    = 400
      ALGO     = Normal
      EDIFF    = 1E-6
      ISMEAR   = 0
      SIGMA    = 0.05
      NELMIN   = 6
      NELM     = 100
      IBRION   = -1                # 静态单点
      NSW      = 0
      ISYM     = 0
      LSOL     = .TRUE.            # --- modifiers/solvation.patch ---
      EB_K     = 78.4              # 水
      TAU      = 0.0               # 忽略空化项（稳健默认）
    KPOINTS: |
      Gamma only（孤立分子）
      0
      Gamma
      1 1 1
      0 0 0
  potcar: [H]
  run: "{{vasp_gam}}"
  asserts:
    - type: regex_number
      path: OUTCAR
      pattern: 'Ediel_sol\s*=\s*([-+0-9.Ee]+)'
      occurrence: last
      abs_min: 1.0e-8
      note: 最后一个 Ediel_sol 必须非零；恒 0 表示 LSOL 未实际耦合
    - type: grep
      path: vasprun.xml
      pattern: 'LSOL'
      note: vasprun.xml 必须记录 LSOL 溶剂参数
    - type: grep
      path: vasprun.xml
      pattern: 'EB_K'
      note: vasprun.xml 必须记录 EB_K 介电常数
    - type: grep
      path: OUTCAR
      pattern: 'General timing and accounting informations'
      note: VASP 正常收尾

# --- 第二波 VASP（2026-07 实测收录，wsl-local）----------------------------------

- name: vasp_dftu_feo
  code: vasp
  description: FeO 岩盐 DFT+U（Dudarev，AFM 初猜）单离子步，验证 LDAU 全链路生效
  blueprint: base_templates/vasp_dftu.incar
  structure: 内联 POSCAR（岩盐常规胞 a=4.28 Å，4 Fe + 4 O，几何同 C10 蓝本）
  truncations:
    NSW: "100 → 1（只走 1 个离子步验证 +U 生效）"
    EDIFF: "1E-6 → 1E-5"
    kmesh: "生产 4x4x4 → 2x2x2 MP"
  timeout: 1800
  files:
    POSCAR: |
      FeO rocksalt a=4.28, AFM-II initial guess
        1.0
        4.2800000000    0.0000000000    0.0000000000
        0.0000000000    4.2800000000    0.0000000000
        0.0000000000    0.0000000000    4.2800000000
      Fe O
        4 4
      Cartesian
        0.0000000000    0.0000000000    0.0000000000
        2.1400000000    2.1400000000    0.0000000000
        2.1400000000    0.0000000000    2.1400000000
        0.0000000000    2.1400000000    2.1400000000
        2.1400000000    2.1400000000    2.1400000000
        2.1400000000    0.0000000000    0.0000000000
        0.0000000000    2.1400000000    0.0000000000
        0.0000000000    0.0000000000    2.1400000000
    INCAR: |
      SYSTEM   = FeO DFT+U smoke
      PREC     = Normal
      ENCUT    = 400
      ALGO     = Normal
      EDIFF    = 1E-5              # smoke 截断：蓝本 1E-6
      ISMEAR   = 0
      SIGMA    = 0.1
      NELMIN   = 6
      NELM     = 100
      IBRION   = 2
      ISIF     = 2
      NSW      = 1                 # smoke 截断：蓝本 100
      EDIFFG   = -0.03
      POTIM    = 0.5
      ADDGRID  = .TRUE.
      LASPH    = .TRUE.
      ISYM     = 0
      ISPIN    = 2                 # FeO 是反铁磁 Mott 绝缘体
      MAGMOM   = 4.0 -4.0 -4.0 -4.0 4*0.0   # Fe1 上 / Fe2 下（POSCAR 顺序），O 零
      LDAU     = .TRUE.
      LDAUTYPE = 2                 # Dudarev
      LMAXMIX  = 4                 # d 电子 U 必须（蓝本硬性要求）
      LDAUL    = 2 -1
      LDAUU    = 4.3 0.0
      LDAUJ    = 0.0 0.0
    KPOINTS: |
      FeO 2x2x2 MP（smoke 截断：生产 4x4x4）
      0
      Monkhorst-Pack
      2 2 2
      0 0 0
  potcar: [Fe, O]
  run: "{{vasp_std}}"
  asserts:
    - type: grep
      path: OUTCAR
      pattern: 'LDA\+U is selected'
      note: OUTCAR 含 'LDA+U is selected' → +U 确实生效（regex 中 + 需转义）
    - type: grep
      path: OUTCAR
      pattern: 'General timing and accounting informations'
      note: VASP 正常收尾（exit 0 由 runner 退出码检查保证）

- name: vasp_soc_pt
  code: vasp
  description: Pt FCC 原胞 SOC 静态（vasp_ncl + LSORBIT），验证非共线链路
  blueprint: base_templates/vasp_relax.incar + modifiers/soc.patch
  structure: 内联 POSCAR（Pt FCC 原胞 1 原子，a=3.922 Å）
  truncations:
    NSW: "100 → 0（静态单点即可验证 SOC 生效）"
    kmesh: "生产 12x12x12 → 6x6x6 MP"
  timeout: 1800
  files:
    POSCAR: |
      Pt FCC primitive, a=3.922 A
        1.0
        0.0000000000    1.9610000000    1.9610000000
        1.9610000000    0.0000000000    1.9610000000
        1.9610000000    1.9610000000    0.0000000000
      Pt
        1
      Cartesian
        0.0000000000    0.0000000000    0.0000000000
    INCAR: |
      SYSTEM   = Pt SOC smoke
      PREC     = Normal
      ENCUT    = 400               # soc.patch：1.3-1.5x 常规值（Pt ENMAX ~230 eV）
      ALGO     = Normal
      EDIFF    = 1E-5
      ISMEAR   = 1                 # 金属 Pt：Methfessel-Paxton
      SIGMA    = 0.2
      NELMIN   = 6
      NELM     = 100
      IBRION   = -1                # 静态单点
      NSW      = 0
      # --- modifiers/soc.patch ---
      LSORBIT  = .TRUE.
      SAXIS    = 0 0 1
      NBANDS   = 16                # 非共线能带 ~2x 标量值，必须显式给（validator WARN）
      LMAXMIX  = 4                 # d 电子体系
      ISYM     = 0
      ADDGRID  = .TRUE.
      LASPH    = .TRUE.
      LREAL    = .FALSE.           # 1 原子原胞
    KPOINTS: |
      Pt 6x6x6 MP（smoke 截断：生产 12x12x12）
      0
      Monkhorst-Pack
      6 6 6
      0 0 0
  potcar: [Pt]
  run: "{{vasp_ncl}}"
  asserts:
    - type: grep
      path: OUTCAR
      pattern: 'LNONCOLLINEAR'
      note: OUTCAR 含 'LNONCOLLINEAR' → vasp_ncl 非共线模式生效
    - type: grep
      path: OUTCAR
      pattern: 'General timing and accounting informations'
      note: VASP 正常收尾（exit 0 由 runner 退出码检查保证）

- name: vasp_metagga_si
  code: vasp
  description: Si 原胞 METAGGA=R2SCAN 静态，验证 meta-GGA 泛函链路
  blueprint: base_templates/vasp_relax.incar + modifiers/metagga.patch
  structure: 内联 POSCAR（2 原子 Si 金刚石原胞，同 si_relax）
  truncations:
    NSW: "100 → 0（静态单点即可验证泛函生效）"
    kmesh: "8x8x8 → 4x4x4 MP"
  timeout: 1200
  files:
    POSCAR: |
      Si
        1.0
        0.0000000000    2.7155000000    2.7155000000
        2.7155000000    0.0000000000    2.7155000000
        2.7155000000    2.7155000000    0.0000000000
      Si
        2
      Cartesian
        0.0000000000    0.0000000000    0.0000000000
        1.3577500000    1.3577500000    1.3577500000
    INCAR: |
      SYSTEM   = Si R2SCAN smoke
      PREC     = Normal
      ENCUT    = 400
      ALGO     = All               # meta-GGA 推荐 All/Damped，数值更稳
      EDIFF    = 1E-6
      ISMEAR   = 0
      SIGMA    = 0.05
      NELMIN   = 6
      NELM     = 100
      IBRION   = -1                # 静态单点
      NSW      = 0
      # --- modifiers/metagga.patch ---
      METAGGA  = R2SCAN
      LASPH    = .TRUE.            # meta-GGA 强制（validator ERROR）
      ADDGRID  = .TRUE.            # meta-GGA 推荐（validator WARN）
      LREAL    = .FALSE.
      ISYM     = 0
    KPOINTS: |
      Si 4x4x4 MP（smoke 截断：蓝本 8x8x8）
      0
      Monkhorst-Pack
      4 4 4
      0 0 0
  potcar: [Si]
  run: "{{vasp_std}}"
  asserts:
    - type: grep
      path: OUTCAR
      pattern: 'R2SCAN'
      note: OUTCAR 含 'R2SCAN'（METAGGA 回显/泛函信息）→ meta-GGA 生效
    - type: grep
      path: OUTCAR
      pattern: 'General timing and accounting informations'
      note: VASP 正常收尾

- name: vasp_efield_h2o
  code: vasp
  description: H2O 分子 VASPsol + 外电场（EFIELD+IDIPOL+LDIPOL）静态，验证 solvation 与 efield patch 同时生效
  blueprint: base_templates/vasp_relax.incar + modifiers/solvation.patch + modifiers/dipole.patch + modifiers/efield.patch
  structure: 内联 POSCAR（H2O 在 12 Å 盒子中心，O-H ~0.958 Å / 角 ~104.5°）
  truncations:
    NSW: "100 → 0（静态单点即可验证两个 patch 生效）"
  timeout: 900
  files:
    POSCAR: |
      H2O molecule in 12 A box
        1.0
        12.0000000000    0.0000000000    0.0000000000
        0.0000000000    12.0000000000    0.0000000000
        0.0000000000    0.0000000000    12.0000000000
      O H
        1 2
      Cartesian
        6.0000000000    6.0000000000    6.0000000000
        6.9572000000    6.0000000000    6.0000000000
        5.7600000000    6.9273000000    6.0000000000
    INCAR: |
      SYSTEM   = H2O efield+sol smoke
      PREC     = Accurate          # solvation.patch：空化能需要更细网格
      ENCUT    = 400
      ALGO     = Normal
      EDIFF    = 1E-6
      ISMEAR   = 0
      SIGMA    = 0.05
      NELMIN   = 6
      NELM     = 100
      IBRION   = -1                # 静态单点
      NSW      = 0
      ISYM     = 0
      # --- modifiers/solvation.patch ---
      LSOL     = .TRUE.
      EB_K     = 78.4              # 水
      TAU      = 0.0
      # --- modifiers/dipole.patch + efield.patch ---
      LDIPOL   = .TRUE.
      IDIPOL   = 3                 # 场/偶极修正沿 z
      DIPOL    = 0.5 0.5 0.5       # 盒中心（分数坐标）
      EFIELD   = 0.1               # eV/Å；必须配 IDIPOL+LDIPOL，否则静默无效
    KPOINTS: |
      Gamma only（孤立分子）
      0
      Gamma
      1 1 1
      0 0 0
  potcar: [O, H]
  run: "{{vasp_gam}}"
  asserts:
    - type: regex_number
      path: OUTCAR
      pattern: 'Ediel_sol\s*=\s*([-+0-9.Ee]+)'
      occurrence: last
      abs_min: 1.0e-8
      note: 最后一个 Ediel_sol 必须非零；恒 0 表示 LSOL 未实际耦合
    - type: grep
      path: vasprun.xml
      pattern: 'LSOL'
      note: vasprun.xml 必须记录 LSOL 溶剂参数
    - type: grep
      path: vasprun.xml
      pattern: 'EB_K'
      note: vasprun.xml 必须记录 EB_K 介电常数
    - type: grep
      path: OUTCAR
      pattern: 'EFIELD'
      note: OUTCAR 含 'EFIELD' 回显 → 外电场被读入（配 IDIPOL+LDIPOL 才实际施加）
    - type: grep
      path: OUTCAR
      pattern: 'General timing and accounting informations'
      note: VASP 正常收尾

# ==============================================================================
# CP2K（4 例）
# ==============================================================================

- name: h2o_geo_opt
  code: cp2k
  description: H2O 分子 GEO_OPT（BFGS），验证 0D Poisson(ANALYTIC) 配置与几何基准
  blueprint: examples/C2_CP2K_H2O_opt
  structure: 内联 H2O.xyz（同 C2 蓝本，20 Å 盒子）
  truncations:
    MAX_ITER: "200 → 50"
  timeout: 1200
  setup_cmds:
    - "ln -sf {{cp2k_data}}/BASIS_MOLOPT ."
    - "ln -sf {{cp2k_data}}/GTH_POTENTIALS ."
  files:
    H2O.xyz: |
      3

      O      10.000000000000000     10.763239000000000     10.596309000000002
      H      10.000000000000000     11.526478000000001     10.000000000000000
      H      10.000000000000000     10.000000000000000     10.000000000000000
    h2o_geo_opt.inp: |
      &GLOBAL
        PROJECT     h2o_geo_opt
        RUN_TYPE    GEO_OPT
        PRINT_LEVEL LOW
      &END GLOBAL

      &FORCE_EVAL
        METHOD Quickstep
        &DFT
          BASIS_SET_FILE_NAME  ./BASIS_MOLOPT
          POTENTIAL_FILE_NAME  ./GTH_POTENTIALS
          &QS
            EPS_DEFAULT 1.0E-12
            METHOD      GPW
          &END QS
          &MGRID
            CUTOFF      400
            REL_CUTOFF  50
            NGRIDS      4
          &END MGRID
          &XC
            &XC_FUNCTIONAL PBE
            &END XC_FUNCTIONAL
          &END XC
          &SCF
            SCF_GUESS   ATOMIC
            EPS_SCF     1.0E-6
            MAX_SCF     300
            &DIAGONALIZATION
              ALGORITHM STANDARD
            &END DIAGONALIZATION
            &MIXING
              METHOD   BROYDEN_MIXING
              ALPHA    0.4
              NBROYDEN 8
            &END MIXING
          &END SCF
          # 孤立分子(0D)：PERIODIC NONE 必须配 0D 兼容 solver（ANALYTIC）
          &POISSON
            POISSON_SOLVER ANALYTIC
            PERIODIC NONE
          &END POISSON
        &END DFT
        &SUBSYS
          &CELL
            ABC     20.0 20.0 20.0
            ALPHA_BETA_GAMMA 90.0 90.0 90.0
            PERIODIC NONE
          &END CELL
          &KIND H
            BASIS_SET DZVP-MOLOPT-SR-GTH
            POTENTIAL GTH-PBE
          &END KIND
          &KIND O
            BASIS_SET DZVP-MOLOPT-SR-GTH
            POTENTIAL GTH-PBE
          &END KIND
          &TOPOLOGY
            COORD_FILE_NAME    ./H2O.xyz
            COORD_FILE_FORMAT  XYZ
          &END TOPOLOGY
        &END SUBSYS
      &END FORCE_EVAL

      &MOTION
        &GEO_OPT
          TYPE         MINIMIZATION
          OPTIMIZER    BFGS
          MAX_ITER     50                  # smoke 截断：蓝本 200
          MAX_DR       3.0E-3
          RMS_DR       1.5E-3
          MAX_FORCE    4.5E-4
          RMS_FORCE    3.0E-4
        &END GEO_OPT
        &PRINT
          &TRAJECTORY
            FORMAT XYZ
            &EACH
              GEO_OPT 1
            &END EACH
          &END TRAJECTORY
        &END PRINT
      &END MOTION
  run: "{{cp2k}} -i h2o_geo_opt.inp -o cp2k.out"
  asserts:
    - type: grep
      path: cp2k.out
      pattern: 'GEOMETRY OPTIMIZATION COMPLETED'
      note: 几何优化收敛
    - type: not_grep
      path: cp2k.out
      pattern: 'ABORT'
      note: 无 CP2K abort
    - type: xyz_angle
      path: h2o_geo_opt-pos-1.xyz
      atoms: [2, 1, 3]
      min: 102
      max: 106
      note: 优化后 H-O-H 键角 104 ± 2°（atoms=H,O,H，顶点为 O；2026-06 实测）

- name: h2o_hirshfeld
  code: cp2k
  description: H2O Hirshfeld 电荷（SHAPE_FUNCTION DENSITY），验证电荷划分基准
  blueprint: examples/C13_CP2K_H2O_hirshfeld
  structure: 内联 H2O.xyz（同 C13 蓝本，10 Å 盒子）
  truncations: {}
  timeout: 600
  setup_cmds:
    - "ln -sf {{cp2k_data}}/BASIS_MOLOPT ."
    - "ln -sf {{cp2k_data}}/GTH_POTENTIALS ."
  files:
    H2O.xyz: |
      3

      O      10.000000000000000     10.763239000000000     10.596309000000002
      H      10.000000000000000     11.526478000000001     10.000000000000000
      H      10.000000000000000     10.000000000000000     10.000000000000000
    h2o_hirshfeld.inp: |
      &GLOBAL
        PROJECT     h2o_hirshfeld
        RUN_TYPE    ENERGY
        PRINT_LEVEL LOW
      &END GLOBAL

      &FORCE_EVAL
        METHOD Quickstep
        &DFT
          BASIS_SET_FILE_NAME  ./BASIS_MOLOPT
          POTENTIAL_FILE_NAME  ./GTH_POTENTIALS
          &QS
            EPS_DEFAULT 1.0E-12
            METHOD      GPW
          &END QS
          &MGRID
            CUTOFF      400
            REL_CUTOFF  50
            NGRIDS      4
          &END MGRID
          &XC
            &XC_FUNCTIONAL PBE
            &END XC_FUNCTIONAL
          &END XC
          &SCF
            SCF_GUESS   ATOMIC
            EPS_SCF     1.0E-7
            MAX_SCF     300
            &DIAGONALIZATION
              ALGORITHM STANDARD
            &END DIAGONALIZATION
            &MIXING
              METHOD   BROYDEN_MIXING
              ALPHA    0.4
              NBROYDEN 8
            &END MIXING
          &END SCF
          &POISSON
            POISSON_SOLVER ANALYTIC
            PERIODIC NONE
          &END POISSON
          &PRINT
            &HIRSHFELD ON
              SELF_CONSISTENT F
              SHAPE_FUNCTION DENSITY   # GAUSSIAN 给 O=-1.117 e 且破坏电荷守恒；
            &END HIRSHFELD             # DENSITY 给 O=-0.304 e（2026.1 实测）
          &END PRINT
        &END DFT
        &SUBSYS
          &CELL
            ABC     10.0 10.0 10.0
            ALPHA_BETA_GAMMA 90.0 90.0 90.0
            PERIODIC NONE
          &END CELL
          &KIND H
            BASIS_SET DZVP-MOLOPT-SR-GTH
            POTENTIAL GTH-PBE
          &END KIND
          &KIND O
            BASIS_SET DZVP-MOLOPT-SR-GTH
            POTENTIAL GTH-PBE
          &END KIND
          &TOPOLOGY
            COORD_FILE_NAME    ./H2O.xyz
            COORD_FILE_FORMAT  XYZ
          &END TOPOLOGY
        &END SUBSYS
      &END FORCE_EVAL
  run: "{{cp2k}} -i h2o_hirshfeld.inp -o cp2k.out"
  asserts:
    - type: grep
      path: cp2k.out
      pattern: 'Hirshfeld Charges'
      note: Hirshfeld 表已打印
    - type: regex_number
      path: cp2k.out
      pattern: '(?m)^\s*\d+\s+O\s+\d+\s+[0-9.]+\s+[0-9.]+\s+(-?[0-9.]+)\s*$'
      occurrence: last
      min: -0.35
      max: -0.25
      note: Hirshfeld O 净电荷 = -0.30 ± 0.05 e（2026-06 实测 -0.304 e）

- name: metadyn_dimer
  code: cp2k
  description: 水二聚体 well-tempered metadynamics（O-O 距离 CV），验证 COLVAR/HILLS 输出
  blueprint: examples/C15_cp2k_metadyn
  structure: 内联 coord.xyz（同 C15 蓝本水二聚体，O-O 2.95 Å 起步）
  truncations:
    STEPS: "5000 → 300"
    NT_HILLS: "100 → 50"
  timeout: 1800
  setup_cmds:
    - "ln -sf {{cp2k_data}}/BASIS_MOLOPT ."
    - "ln -sf {{cp2k_data}}/GTH_POTENTIALS ."
  files:
    coord.xyz: |
      6
      water dimer
      O      0.000    0.000    0.000
      H      0.757    0.586    0.000
      H     -0.757    0.586    0.000
      O      0.000    0.000    2.950
      H      0.757   -0.586    2.950
      H     -0.757   -0.586    2.950
    metadyn_dimer.inp: |
      &GLOBAL
        PROJECT     metadyn_dimer
        RUN_TYPE    MD
        PRINT_LEVEL LOW
      &END GLOBAL

      &FORCE_EVAL
        METHOD Quickstep
        &DFT
          BASIS_SET_FILE_NAME  ./BASIS_MOLOPT
          POTENTIAL_FILE_NAME  ./GTH_POTENTIALS
          &QS
            EPS_DEFAULT 1.0E-12
            METHOD      GPW
          &END QS
          &MGRID
            CUTOFF      400
            REL_CUTOFF  50
            NGRIDS      4
          &END MGRID
          &XC
            &XC_FUNCTIONAL PBE
            &END XC_FUNCTIONAL
          &END XC
          &SCF
            SCF_GUESS   RESTART
            EPS_SCF     1.0E-6
            MAX_SCF     300
            &DIAGONALIZATION
              ALGORITHM STANDARD
            &END DIAGONALIZATION
            &MIXING
              METHOD   BROYDEN_MIXING
              ALPHA    0.4
              NBROYDEN 8
            &END MIXING
          &END SCF
          &POISSON
            PERIODIC XYZ
          &END POISSON
        &END DFT
        &SUBSYS
          &CELL
            ABC     10.0 10.0 10.0
            ALPHA_BETA_GAMMA 90.0 90.0 90.0
            PERIODIC XYZ
          &END CELL
          &KIND H
            BASIS_SET DZVP-MOLOPT-SR-GTH
            POTENTIAL GTH-PBE
          &END KIND
          &KIND O
            BASIS_SET DZVP-MOLOPT-SR-GTH
            POTENTIAL GTH-PBE
          &END KIND
          # CV1: 水二聚体 O-O 距离（coord.xyz 中第 1、4 号原子）
          &COLVAR
            &DISTANCE
              ATOMS 1 4
            &END DISTANCE
          &END COLVAR
          &TOPOLOGY
            COORD_FILE_NAME    ./coord.xyz
            COORD_FILE_FORMAT  XYZ
          &END TOPOLOGY
        &END SUBSYS
      &END FORCE_EVAL

      &MOTION
        &MD
          ENSEMBLE    NVT
          STEPS       300                # smoke 截断：蓝本 5000
          TIMESTEP    0.5                # fs；含 H → ≤ 0.5
          TEMPERATURE 300.0
          &THERMOSTAT
            TYPE        CSVR
            &CSVR
              TIMECON   100.0
            &END CSVR
          &END THERMOSTAT
        &END MD
        &FREE_ENERGY
          &METADYN
            DO_HILLS  .TRUE.
            NT_HILLS  50                 # smoke 截断：蓝本 100
            WW        [kcalmol] 1.5
            &METAVAR
              SCALE     0.5
              COLVAR    1
              # QUARTIC + POSITION 已是上墙；CP2K &WALL 没有 DIRECTION 关键字
              &WALL
                TYPE      QUARTIC
                POSITION  [angstrom] 5.0
                &QUARTIC
                  K [kcalmol] 40.0
                &END QUARTIC
              &END WALL
            &END METAVAR
            WELL_TEMPERED .TRUE.
            WTGAMMA     20
            &PRINT
              &COLVAR
                COMMON_ITERATION_LEVELS 3
                &EACH
                  MD    10
                &END EACH
              &END COLVAR
              &HILLS
                COMMON_ITERATION_LEVELS 3
                &EACH
                  MD    10
                &END EACH
              &END HILLS
            &END PRINT
          &END METADYN
        &END FREE_ENERGY
        &PRINT
          &TRAJECTORY
            FORMAT     XYZ
            &EACH
              MD       10
            &END EACH
          &END TRAJECTORY
        &END PRINT
      &END MOTION
  run: "{{cp2k}} -i metadyn_dimer.inp -o cp2k.out"
  asserts:
    - type: file_exists
      path: metadyn_dimer-COLVAR.metadynLog
      min_size: 1
      note: COLVAR 文件非空
    - type: file_exists
      path: metadyn_dimer-HILLS.metadynLog
      min_size: 1
      note: HILLS 文件非空
    - type: not_grep
      path: cp2k.out
      pattern: 'ABORT'
      note: 无 CP2K abort

- name: feo_dftu_scf_start
  code: cp2k
  description: FeO 岩盐 DFT+U（UKS + AFM 初猜），只验证能进入 SCF 迭代（历史坑：DFT+U/k-points/UKS 直接 abort）
  blueprint: examples/C10_CP2K_FeO_dftu
  structure: 内联 FeO.xyz（同 C10 蓝本，岩盐常规胞 a=4.28 Å，Fe1/Fe2 反铁磁初猜）
  truncations:
    MAX_SCF: "300 → 10（人为截断：本例只验证进入 SCF，收敛被故意放弃，故 allow_nonzero_exit）"
  timeout: 900
  allow_nonzero_exit: true
  setup_cmds:
    - "ln -sf {{cp2k_data}}/BASIS_MOLOPT ."
    - "ln -sf {{cp2k_data}}/GTH_POTENTIALS ."
  files:
    FeO.xyz: |
      8
      FeO rocksalt conventional cell, a = 4.28 Angstrom; AFM-II: Fe1 = spin-up (111), Fe2 = spin-down (111)
      Fe1      0.000000      0.000000      0.000000
      Fe2      2.140000      2.140000      0.000000
      Fe2      2.140000      0.000000      2.140000
      Fe2      0.000000      2.140000      2.140000
      O        2.140000      2.140000      2.140000
      O        2.140000      0.000000      0.000000
      O        0.000000      2.140000      0.000000
      O        0.000000      0.000000      2.140000
    feo_dftu.inp: |
      &GLOBAL
        PROJECT     feo_dftu_scf_start
        RUN_TYPE    ENERGY_FORCE
        PRINT_LEVEL LOW
      &END GLOBAL

      &FORCE_EVAL
        METHOD Quickstep
        &DFT
          BASIS_SET_FILE_NAME  ./BASIS_MOLOPT
          POTENTIAL_FILE_NAME  ./GTH_POTENTIALS
          PLUS_U_METHOD MULLIKEN
          # FeO 是反铁磁 Mott 绝缘体：不开 UKS 会收敛到错误的非磁解
          UKS .TRUE.
          &QS
            EPS_DEFAULT 1.0E-12
            METHOD      GPW
          &END QS
          &MGRID
            CUTOFF      600
            REL_CUTOFF  60
            NGRIDS      4
          &END MGRID
          &XC
            &XC_FUNCTIONAL PBE
            &END XC_FUNCTIONAL
          &END XC
          &SCF
            SCF_GUESS   RESTART
            EPS_SCF     1.0E-7
            MAX_SCF     10               # smoke 人为截断：只验证进入 SCF
            &DIAGONALIZATION
              ALGORITHM STANDARD
            &END DIAGONALIZATION
            &MIXING
              METHOD   BROYDEN_MIXING
              ALPHA    0.4
              NBROYDEN 8
            &END MIXING
            &SMEAR
              METHOD FERMI_DIRAC
              ELECTRONIC_TEMPERATURE [K] 300
            &END SMEAR
            ADDED_MOS 10
          &END SCF
          &POISSON
            PERIODIC XYZ
          &END POISSON
          # 版本门（2026.1 实测）：CP2K < 2026.2 出现任何 &KPOINTS 块都会
          # 让 Mulliken DFT+U abort（"not implemented for k-points"）；
          # 完全省略 &KPOINTS = Gamma 点。>= 2026.2 可换 MP 网格。
          &PRINT
            &PLUS_U ON
            &END PLUS_U
          &END PRINT
        &END DFT
        &SUBSYS
          &CELL
            ABC     4.28 4.28 4.28
            ALPHA_BETA_GAMMA 90.0 90.0 90.0
            PERIODIC XYZ
          &END CELL
          &KIND Fe1                            # spin-up Fe 子晶格
            BASIS_SET DZVP-MOLOPT-SR-GTH
            POTENTIAL GTH-PBE
            MAGNETIZATION 4.0                  # Fe2+ d6 高自旋 ~ +4 mu_B
            &DFT_PLUS_U ON
              L 2
              U_MINUS_J [eV] 4.0
            &END DFT_PLUS_U
          &END KIND
          &KIND Fe2                            # spin-down Fe 子晶格
            BASIS_SET DZVP-MOLOPT-SR-GTH
            POTENTIAL GTH-PBE
            MAGNETIZATION -4.0
            &DFT_PLUS_U ON
              L 2
              U_MINUS_J [eV] 4.0
            &END DFT_PLUS_U
          &END KIND
          &KIND O
            BASIS_SET DZVP-MOLOPT-SR-GTH
            POTENTIAL GTH-PBE
          &END KIND
          &TOPOLOGY
            COORD_FILE_NAME    ./FeO.xyz
            COORD_FILE_FORMAT  XYZ
          &END TOPOLOGY
        &END SUBSYS
      &END FORCE_EVAL
  run: "{{cp2k}} -i feo_dftu.inp -o cp2k.out"
  asserts:
    - type: grep
      path: cp2k.out
      pattern: 'SCF WAVEFUNCTION OPTIMIZATION'
      note: 已进入 SCF 迭代（之后因 MAX_SCF=10 人为截断而报未收敛，属预期）


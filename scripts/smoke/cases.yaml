- name: lammps_nve_al
  code: lammps
  description: Al FCC 108 原子 EAM 短 NVE，验证能量守恒（Etot 漂移）与超胞尺度
  blueprint: base_templates/lammps_nve.in + examples/L1_Al_EAM_MD
  structure: LAMMPS lattice/create_atoms 内建 3x3x3 FCC 常规胞（a=4.0495 Å，108 原子）
  truncations:
    production: "200000 步(100 ps) → 500 步(0.5 ps)"
  timeout: 600
  files:
    in.nve: |
      # Al FCC EAM NVE smoke（蓝本 base_templates/lammps_nve.in，已按 truncations 截断）
      units           metal
      atom_style      atomic
      boundary        p p p
      newton          on

      # 3x3x3 FCC 常规胞 = 108 原子（a = 4.0495 Å，同 L1 蓝本）
      lattice         fcc 4.0495
      region          box block 0 3 0 3 0 3
      create_box      1 box
      create_atoms    1 box

      pair_style      eam
      pair_coeff      * * {{al_eam_path}}   # env 给定 Al_jnp.eam

      min_style       cg
      minimize        1.0e-8 1.0e-10 200 2000

      velocity        all create 300.0 12345 dist gaussian

      neighbor        2.0 bin
      neigh_modify    every 1 delay 0 check yes
      timestep        0.001               # 1 fs（无 H 体系）

      thermo          50
      thermo_style    custom step temp pe ke etotal

      # 记录 NVE 初始 Etot/atom（run 0 触发热力学计算后取值）
      run             0
      variable        e0 equal $(etotal/atoms)

      fix             nve all nve
      run             500
      unfix           nve

      # NVE 判据：Etot 漂移（蓝本要求 < 1 meV/atom/ps；smoke 阈值 0.01 eV/atom）
      # 注意：LAMMPS equal 变量绝对值函数是 abs()，没有 fabs()
      variable        edrift equal abs(etotal/atoms-v_e0)
      print           "ETOT_DRIFT_EV_PER_ATOM ${edrift}"
  run: "{{lammps}} -in in.nve -log lammps.log"
  asserts:
    - type: not_grep
      path: lammps.log
      pattern: '(?i)\bERROR\b'
      note: LAMMPS 报 ERROR 时退出码也是 0 —— 必须 grep 日志判成败
    - type: grep
      path: lammps.log
      pattern: 'Loop time'
      note: 正常跑完
    - type: regex_number
      path: lammps.log
      pattern: 'ETOT_DRIFT_EV_PER_ATOM\s+([0-9.eE+-]+)'
      occurrence: last
      min: 0
      max: 0.01
      note: NVE 500 步 Etot 漂移 < 0.01 eV/atom（2026-07 实测 6.4e-06）

- name: lammps_npt_al
  code: lammps
  description: Al FCC 108 原子 EAM 短 NPT（300K / 0 bar iso），验证压强调节趋向目标值
  blueprint: base_templates/lammps_md.in (NPT stage) + examples/L3_Al_EAM_NPT
  structure: 同 lammps_nve_al（lattice/create_atoms 3x3x3 FCC，108 原子）
  truncations:
    equilibration: "20000 步(10 ps) → 500 步(1 ps，dt=2 fs)"
    production: 200000 步 production 整段删除（smoke 不需要）
  timeout: 600
  files:
    in.npt: |
      # Al FCC EAM NPT smoke（蓝本 base_templates/lammps_md.in NPT stage，已按 truncations 截断）
      units           metal
      atom_style      atomic
      boundary        p p p
      newton          on

      lattice         fcc 4.0495
      region          box block 0 3 0 3 0 3
      create_box      1 box
      create_atoms    1 box

      pair_style      eam
      pair_coeff      * * {{al_eam_path}}

      min_style       cg
      minimize        1.0e-8 1.0e-10 200 2000

      velocity        all create 300.0 12345 dist gaussian

      neighbor        2.0 bin
      neigh_modify    every 1 delay 0 check yes
      # 2 fs（无 H 体系安全）：500 步 = 1 ps，给 barostat 足够弛豫时间
      #（0 K 平衡晶格直接升温到 300 K 初压 ~+16 kbar，0.5 ps 内弛豫不完）
      timestep        0.002

      thermo          50
      thermo_style    custom step temp press pe etotal vol

      # 末段压力滑窗平均：每 100 步输出一次（10 样本/窗口），
      # run 结束时 f_pav = 最后 100 步平均压力（bar）；
      # 单一标量输入的 fix ave/time 产出全局标量，用 f_pav 而非 f_pav[1]
      variable        p equal press
      fix             pav all ave/time 10 10 100 v_p

      # Tdamp = 0.1 ps，Pdamp = 1.0 ps（蓝本推荐区间 50-100x / 500-1000x dt 内）
      fix             npt all npt temp 300.0 300.0 0.1 iso 0.0 0.0 1.0
      run             500
      unfix           npt

      variable        plast equal f_pav
      print           "P_AVG_LAST100_BAR ${plast}"
  run: "{{lammps}} -in in.npt -log lammps.log"
  asserts:
    - type: not_grep
      path: lammps.log
      pattern: '(?i)\bERROR\b'
      note: LAMMPS 报 ERROR 时退出码也是 0 —— 必须 grep 日志判成败
    - type: grep
      path: lammps.log
      pattern: 'Loop time'
      note: 正常跑完
    - type: regex_number
      path: lammps.log
      pattern: 'P_AVG_LAST100_BAR\s+(-?[0-9.eE+]+)'
      occurrence: last
      min: -3000
      max: 3000
      note: 末段（最后 100 步滑窗）平均压力趋向 0 bar，|P| < 3000 bar（2026-07 实测 -92 bar）

- name: lammps_shake_spc
  code: lammps
  description: SPC/E 水 27 分子 NVT（2 fs + SHAKE 刚性约束），验证分子拓扑势与 shake 链路
  blueprint: modifiers/lammps/fix_shake.snip + references/lammps.md（刚性水段落）
  structure: 内联 gen_spce.py（setup_cmds 里 python3 生成 spce.data：27 分子 3x3x3 网格+小抖动，盒 9.32 Å≈1 g/cm3，SPC/E 几何 O-H=1.0 Å / 角 109.47°，电荷 O=-0.8476 / H=+0.4238）
  truncations:
    equilibration: "生产 ns 级 → 500 步(1 ps)"
    cutoff: "9-10 Å → 4.3 Å（盒 9.32 Å，cutoff+skin 必须 < 盒长一半 4.66 Å）"
  timeout: 600
  setup_cmds:
    - "python3 gen_spce.py"
  files:
    gen_spce.py: |
      #!/usr/bin/env python3
      # gen_spce.py — 生成 SPC/E 水盒 spce.data（smoke 用，确定性 seed）
      # 27 分子（3x3x3 网格 + 小抖动），盒 9.32 Å ≈ 1 g/cm3
      # SPC/E 刚性几何：O-H = 1.0 Å，H-O-H = 109.47°
      # SPC/E 电荷：O = -0.8476 e，H = +0.4238 e
      import math
      import random

      random.seed(20260619)

      L = 9.32            # 盒边长 (Å)：27 分子 ~1 g/cm3
      NGRID = 3           # 3x3x3 = 27 分子
      ROH = 1.0           # SPC/E O-H 键长 (Å)
      ANG = math.radians(109.47)
      QO, QH = -0.8476, 0.4238
      MO, MH = 15.9994, 1.008


      def unit(v):
          n = math.sqrt(v[0] ** 2 + v[1] ** 2 + v[2] ** 2)
          return [v[0] / n, v[1] / n, v[2] / n]


      waters = []
      sp = L / NGRID
      for i in range(NGRID):
          for j in range(NGRID):
              for k in range(NGRID):
                  o = [((i + 0.5) * sp + random.uniform(-0.15, 0.15)) % L,
                       ((j + 0.5) * sp + random.uniform(-0.15, 0.15)) % L,
                       ((k + 0.5) * sp + random.uniform(-0.15, 0.15)) % L]
                  u1 = unit([random.gauss(0.0, 1.0) for _ in range(3)])
                  t = unit([random.gauss(0.0, 1.0) for _ in range(3)])
                  d = sum(t[m] * u1[m] for m in range(3))
                  u2v = unit([t[m] - d * u1[m] for m in range(3)])
                  u2 = [math.cos(ANG) * u1[m] + math.sin(ANG) * u2v[m]
                        for m in range(3)]
                  h1 = [(o[m] + ROH * u1[m]) % L for m in range(3)]
                  h2 = [(o[m] + ROH * u2[m]) % L for m in range(3)]
                  waters.append((o, h1, h2))

      nmol = len(waters)
      with open("spce.data", "w") as f:
          f.write("# SPC/E water 27 molecules, by gen_spce.py (input_build smoke)\n\n")
          f.write("%d atoms\n%d bonds\n%d angles\n\n" % (3 * nmol, 2 * nmol, nmol))
          f.write("2 atom types\n1 bond types\n1 angle types\n\n")
          f.write("0.0 %.4f xlo xhi\n0.0 %.4f ylo yhi\n0.0 %.4f zlo zhi\n\n" % (L, L, L))
          f.write("Masses\n\n1 %.4f  # O\n2 %.4f  # H\n\n" % (MO, MH))
          f.write("Atoms # full\n\n")
          aid = 0
          for mol, (o, h1, h2) in enumerate(waters, start=1):
              aid += 1
              f.write("%d %d 1 %.4f %.6f %.6f %.6f\n"
                      % (aid, mol, QO, o[0], o[1], o[2]))
              aid += 1
              f.write("%d %d 2 %.4f %.6f %.6f %.6f\n"
                      % (aid, mol, QH, h1[0], h1[1], h1[2]))
              aid += 1
              f.write("%d %d 2 %.4f %.6f %.6f %.6f\n"
                      % (aid, mol, QH, h2[0], h2[1], h2[2]))
          f.write("\nBonds\n\n")
          bid = 0
          for m in range(nmol):
              base = 3 * m + 1
              bid += 1
              f.write("%d 1 %d %d\n" % (bid, base, base + 1))
              bid += 1
              f.write("%d 1 %d %d\n" % (bid, base, base + 2))
          f.write("\nAngles\n\n")
          for m in range(nmol):
              base = 3 * m + 1
              f.write("%d 1 %d %d %d\n" % (m + 1, base + 1, base, base + 2))

      print("spce.data: %d waters written" % nmol)
    in.shake: |
      # SPC/E 水 NVT + SHAKE smoke（27 分子 / 盒 9.32 Å；结构由 gen_spce.py 生成）
      units           real                # kcal/mol, Å, fs, K, atm
      atom_style      full
      boundary        p p p
      newton          on

      read_data       spce.data

      # SPC/E：只有 O-O LJ（ε=0.1553 kcal/mol, σ=3.166 Å），H 无 LJ
      # 注意：盒 9.32 Å → cutoff+skin 必须 < 盒长一半 4.66 Å，
      # 故 smoke 用 4.3 Å cutoff + 0.3 Å skin（生产应加大盒子用 9-10 Å cutoff）
      pair_style      lj/cut/coul/cut 4.3
      pair_coeff      1 1 0.1553 3.166
      pair_coeff      1 2 0.0 0.0
      pair_coeff      2 2 0.0 0.0

      # SHAKE 约束几何（r_OH=1.0 Å, 角=109.47°），力常数只影响约束前的瞬态
      bond_style      harmonic
      bond_coeff      1 450.0 1.0
      angle_style     harmonic
      angle_coeff     1 55.0 109.47

      # 水分子内 1-2/1-3 近邻排除 LJ 与库仑
      special_bonds   lj 0.0 0.0 0.0 coul 0.0 0.0 0.0

      neighbor        0.3 bin
      neigh_modify    every 1 delay 0 check yes

      velocity        all create 300.0 12345 dist gaussian mom yes rot yes

      # fix shake 必须在所有附加力 fix 之后（modifiers/lammps/fix_shake.snip）；
      # 第 3 个参数是 stats 打印频率，0 = 不打印（断言需要 stats，故给 10）
      fix             sh all shake 1.0e-4 20 10 b 1 a 1
      fix             nvt all nvt temp 300.0 300.0 100.0

      timestep        2.0                 # 2 fs：SHAKE 刚性水才合法（fix_shake.snip）
      thermo          50
      thermo_style    custom step temp pe ke etotal press

      run             500
  run: "{{lammps}} -in in.shake -log lammps.log"
  asserts:
    - type: not_grep
      path: lammps.log
      pattern: '(?i)\bERROR\b'
      note: LAMMPS 报 ERROR 时退出码也是 0 —— 必须 grep 日志判成败
    - type: grep
      path: lammps.log
      pattern: 'Loop time'
      note: 正常跑完
    - type: regex_number
      path: lammps.log
      pattern: '(?m)^Bond:\s+1\s+(\S+)\s+\S+\s+\d+\s*$'
      occurrence: last
      min: 0.999
      max: 1.001
      note: "SHAKE stats 键 ave = 1.0 ± 0.001 Å（22Jul2025 起格式为 'Bond: <type> <ave> <delta> <count>'；2026-07 实测 0.999998）"

- name: lammps_plumed_ar
  code: lammps
  description: Ar LJ 108 原子 NVT + fix plumed（DISTANCE CV + PRINT stride 10），验证 PLUMED 接口与 COLVAR 输出
  blueprint: base_templates/lammps_plumed.in + examples/L8_lammps_plumed
  structure: LAMMPS lattice/create_atoms 3x3x3 FCC Ar（a=5.256 Å，108 原子）
  truncations:
    production: "100000 步 → 500 步(1 ps)"
  timeout: 600
  files:
    in.plumed: |
      # Ar LJ + PLUMED smoke（蓝本 examples/L8_lammps_plumed，已按 truncations 截断）
      units           metal
      atom_style      atomic
      boundary        p p p
      newton          on

      # 3x3x3 FCC 常规胞 = 108 原子（Ar a = 5.256 Å）
      lattice         fcc 5.256
      region          box block 0 3 0 3 0 3
      create_box      1 box
      create_atoms    1 box
      mass            1 39.948

      pair_style      lj/cut 8.5
      pair_coeff      1 1 0.0104 3.405   # Ar LJ（ε eV, σ Å）

      velocity        all create 100.0 12345 dist gaussian

      neighbor        2.0 bin
      neigh_modify    every 1 delay 0 check yes
      timestep        0.002

      fix             nvt all nvt temp 100.0 100.0 0.1

      # PLUMED 接口：CV 与偏置都在 plumed.dat；同一时刻只允许一个 fix plumed
      fix             pl all plumed plumedfile plumed.dat outfile plumed.out

      thermo          50
      thermo_style    custom step temp pe etotal press

      run             500
    plumed.dat: |
      # plumed.dat（同 L8 蓝本）：DISTANCE CV + PRINT stride 10
      d1: DISTANCE ATOMS=1,2
      PRINT ARG=d1 FILE=COLVAR STRIDE=10
  run: "{{lammps_full}} -in in.plumed -log lammps.log"
  asserts:
    - type: not_grep
      path: lammps.log
      pattern: '(?i)\bERROR\b'
      note: LAMMPS 报 ERROR 时退出码也是 0 —— 必须 grep 日志判成败
    - type: grep
      path: lammps.log
      pattern: 'Loop time'
      note: 正常跑完
    - type: file_exists
      path: COLVAR
      min_size: 1
      note: COLVAR 文件非空
    - type: grep
      path: COLVAR
      pattern: '(?m)(?:^\s*\d+\.\d+\s+\S+.*\n){41}'
      note: COLVAR 数据行 > 40（500 步 / stride 10 = 51 行；41 个连续数据行作判据，2026-07 实测共 52 行含表头）

